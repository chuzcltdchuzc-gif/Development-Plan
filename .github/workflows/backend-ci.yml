name: Backend CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: pytest / ruff / mypy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Detect backend changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - "backend/**"
              - ".github/workflows/backend-ci.yml"

      - name: Set up Python
        if: steps.filter.outputs.backend == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        if: steps.filter.outputs.backend == 'true'
        run: python -m pip install -e ".[dev]"

      - name: Ruff (lint)
        if: steps.filter.outputs.backend == 'true'
        run: ruff check .

      - name: mypy (type check)
        if: steps.filter.outputs.backend == 'true'
        run: mypy app tests

      - name: pytest
        if: steps.filter.outputs.backend == 'true'
        run: pytest -q

      # OpenAPI Source-of-Truth Hardening: backend/app is the only allowed
      # origin for lib/api-spec/openapi.yaml — this fails the build if the
      # committed spec no longer matches what the current FastAPI app
      # actually exports (backend/scripts/export_openapi.py), the same
      # "regenerate, then diff against committed output" shape
      # frontend-ci.yml already uses for the generated API client below it.
      - name: OpenAPI export drift check
        if: steps.filter.outputs.backend == 'true'
        run: python scripts/export_openapi.py --check
