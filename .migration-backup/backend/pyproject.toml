[project]
name = "landvault-api"
version = "0.1.0"
description = "AquaSavannah LandVault backend (B0 kernel foundation)"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.139.0",
    "uvicorn[standard]==0.51.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "sqlalchemy==2.0.51",
    "asyncpg==0.31.0",
    "alembic==1.18.5",
    "pyjwt[crypto]==2.13.0",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.15.21",
    "mypy==2.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Header()/Cookie() are designed to be called in argument
# defaults — that's the framework's own idiom, not the mutable-default-arg
# bug B008 exists to catch.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Cookie", "app.kernel.authorization.pep.require_role"]

[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_defs = true
# Payload/resource/claims dicts (audit entries, PDP resource descriptors, JWT
# claims, JSON request/response bodies) are genuinely untyped JSON — requiring
# dict[str, Any] everywhere adds verbosity with no real safety benefit here.
disallow_any_generics = false

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
# Test helpers routinely return parsed response.json() (Any) typed loosely
# as dict for readability — not worth threading precise types through.
warn_return_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
