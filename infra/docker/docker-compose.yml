name: aquasavannah-landvault

services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    env_file: ../../.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    command: start-dev
    env_file: ../../.env
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - "8080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data

  backend:
    build:
      context: ../../backend
    restart: unless-stopped
    env_file: ../../.env
    environment:
      # Least-privilege role — never the schema-owning POSTGRES_USER. See
      # migrations/versions/0002_app_role_least_privilege.py.
      DATABASE_URL: postgresql+asyncpg://landvault_app:${POSTGRES_APP_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # Only used if migrations are run via `docker compose exec backend
      # alembic upgrade head`; the owning role, deliberately not what the
      # running app uses (DATABASE_URL above).
      MIGRATIONS_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # .env's KEYCLOAK_* values are host-oriented (localhost:8080, for
      # running the backend outside Docker against Keycloak's published
      # port) — unreachable from inside this container's network, where
      # Keycloak is only addressable via its compose service name. Found
      # and fixed as a B4 Slice 2 live-verification blocker (pre-existing
      # gap, not introduced by Slice 2 — DATABASE_URL got the identical
      # override above but these three were never added).
      KEYCLOAK_REALM_URL: http://keycloak:8080/realms/landvault
      KEYCLOAK_ADMIN_TOKEN_URL: http://keycloak:8080/realms/landvault/protocol/openid-connect/token
      KEYCLOAK_ADMIN_API_URL: http://keycloak:8080/admin/realms/landvault
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ../../frontend
    restart: unless-stopped
    env_file: ../../.env
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  keycloak_data:
