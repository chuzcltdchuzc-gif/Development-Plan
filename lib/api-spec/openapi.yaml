components:
  schemas:
    AcceptInvitationRequest:
      properties:
        token:
          type: string
          title: Token
        password:
          type: string
          title: Password
        full_name:
          type: string
          title: Full Name
        country:
          anyOf:
          - type: string
          - type: 'null'
          title: Country
      additionalProperties: false
      type: object
      required:
      - token
      - password
      - full_name
      title: AcceptInvitationRequest
    AcceptInvitationSupabaseRequest:
      properties:
        token:
          type: string
          title: Token
        full_name:
          type: string
          title: Full Name
        country:
          anyOf:
          - type: string
          - type: 'null'
          title: Country
      additionalProperties: false
      type: object
      required:
      - token
      - full_name
      title: AcceptInvitationSupabaseRequest
      description: 'Supabase path (IMVP-3A) — deliberately has no password, identity_subject,

        email, tenant, or role field: extra="forbid" means a client attempting to

        supply any of those is rejected outright (422), not silently ignored. The

        identity comes exclusively from the caller''s already-verified Supabase

        access token (require_auth); tenant/role come exclusively from the

        invitation itself.'
    AssignRoleRequest:
      properties:
        role:
          type: string
          title: Role
      additionalProperties: false
      type: object
      required:
      - role
      title: AssignRoleRequest
    CreateDelegationRequest:
      properties:
