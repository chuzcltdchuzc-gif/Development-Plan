          title: Delegate User Id
        delegated_roles:
          items:
            type: string
          type: array
          title: Delegated Roles
        scope:
          type: string
          title: Scope
          default: tenant_governance
        expires_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Expires At
      additionalProperties: false
      type: object
      required:
      - delegate_user_id
      - delegated_roles
      title: CreateDelegationRequest
    CreateInvitationRequest:
      properties:
