openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: AquaSavannah LandVault API — land-registry and verification platform for Nigeria
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: parcels
    description: Land parcel registry
  - name: evidence
    description: Evidence and documents
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /parcels:
    get:
      operationId: listParcels
      tags: [parcels]
      summary: List parcels
      description: >-
        The governed backend's list endpoint (`GET /v1/parcels`) currently accepts no query
        parameters at all — no filtering, search, or pagination is implemented server-side. This is
        a known, reported contract gap (see the Frontend–Backend Contract Reconciliation Report),
        not a client omission.
      responses:
        "200":
          description: List of parcels
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParcelList"
    post:
      operationId: createParcel
      tags: [parcels]
      summary: Register a new land parcel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParcelInput"
      responses:
        "201":
          description: Parcel registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Parcel"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /parcels/{id}:
    get:
      operationId: getParcel
      tags: [parcels]
      summary: Get a parcel by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Parcel detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Parcel"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateParcel
      tags: [parcels]
      summary: Update parcel details
      description: >-
        Matches the governed backend's `UPDATABLE_FIELDS` allow-list exactly. `status` is
        deliberately not updatable here — the parcel lifecycle is one-way (ACTIVE → ARCHIVED) via
        the dedicated archive operation below, not a generic field write.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParcelUpdate"
      responses:
        "200":
          description: Updated parcel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Parcel"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /parcels/{id}/archive:
    post:
      operationId: archiveParcel
      tags: [parcels]
      summary: Archive a parcel (one-way ACTIVE → ARCHIVED)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Archived parcel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Parcel"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /parcels/{id}/evidence:
    get:
      operationId: listParcelEvidence
      tags: [evidence]
      summary: List evidence for a parcel
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Evidence list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Evidence"
    post:
      operationId: addParcelEvidence
      tags: [evidence]
      summary: Add evidence to a parcel
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvidenceInput"
      responses:
        "201":
          description: Evidence added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Evidence"

  /evidence/{evidenceId}:
    patch:
      operationId: updateEvidence
      tags: [evidence]
      summary: Update evidence status (verify/reject)
      parameters:
        - name: evidenceId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvidenceUpdate"
      responses:
        "200":
          description: Updated evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Evidence"
    delete:
      operationId: deleteEvidence
      tags: [evidence]
      summary: Remove evidence
      parameters:
        - name: evidenceId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Parcel:
      type: object
      description: >-
        Mirrors the governed backend's actual `_parcel_view` response shape exactly
        (backend/app/contexts/registry/application/parcel_service.py). No `trust_score` and no
        `latitude`/`longitude` fields exist here — those were legacy, ungoverned assumptions removed
        during IMVP-2 frontend stabilization (see the IMVP-2 report). Geometry is a separate Spatial
        bounded-context concern, referenced only via the opaque `geometry_reference` pointer.
      properties:
        parcel_id:
          type: string
        tenant_id:
          type: string
        country_code:
          type: string
        origin:
          type: string
        created_by:
          type: string
        status:
          type: string
          enum: [ACTIVE, ARCHIVED]
          description: One-way lifecycle — ACTIVE to ARCHIVED only, via the archive operation.
        parcel_number:
          type: ["string", "null"]
          description: Atomically allocated registry number (ADR-014); null until allocation completes.
        title:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        state:
          type: ["string", "null"]
        lga:
          type: ["string", "null"]
        ward:
          type: ["string", "null"]
        community:
          type: ["string", "null"]
        property_type:
          type: ["string", "null"]
        size_sqm:
          type: ["number", "null"]
        ownership_type:
          type: ["string", "null"]
        current_owner_name:
          type: ["string", "null"]
        current_owner_contact:
          type: ["string", "null"]
        created_at:
          type: string
        updated_at:
          type: string
        archived_at:
          type: ["string", "null"]
        geometry_reference:
          type: ["string", "null"]
          description: Opaque pointer into the Spatial bounded context — never interpreted by Registry.
      required:
        - parcel_id
        - tenant_id
        - country_code
        - origin
        - created_by
        - status
        - created_at
        - updated_at

    ParcelList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Parcel"
        total:
          type: number
      required:
        - items
        - total

    ParcelInput:
      type: object
      description: Mirrors CreateParcelRequest (backend/app/contexts/registry/api/dtos.py) exactly.
      properties:
        country_code:
          type: string
        title:
          type: string
        address:
          type: string
          minLength: 1
        state:
          type: string
          minLength: 1
        lga:
          type: string
          minLength: 1
        ward:
          type: string
        community:
          type: string
        property_type:
          type: string
        size_sqm:
          type: number
          minimum: 1
        ownership_type:
          type: string
        current_owner_name:
          type: string
          minLength: 1
        current_owner_contact:
          type: string
      required:
        - address
        - state
        - lga
        - size_sqm
        - property_type
        - current_owner_name

    ParcelUpdate:
      type: object
      description: >-
        Mirrors UpdateParcelRequest / Parcel.UPDATABLE_FIELDS exactly. No `status` field — the
        parcel lifecycle changes only through the dedicated archive operation.
      properties:
        title:
          type: string
        address:
          type: string
        state:
          type: string
        lga:
          type: string
        ward:
          type: string
        community:
          type: string
        property_type:
          type: string
        size_sqm:
          type: number
        ownership_type:
          type: string
        current_owner_name:
          type: string
        current_owner_contact:
          type: string

    Evidence:
      type: object
      properties:
        id:
          type: string
        parcel_id:
          type: string
        document_type:
          type: string
          enum: [survey_plan, certificate_of_occupancy, deed_of_assignment, affidavit, purchase_receipt, governors_consent, court_order, other]
        file_name:
          type: string
        notes:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending_review, verified, rejected]
        uploaded_at:
          type: string
          format: date-time
      required:
        - id
        - parcel_id
        - document_type
        - file_name
        - status
        - uploaded_at

    EvidenceInput:
      type: object
      properties:
        document_type:
          type: string
          enum: [survey_plan, certificate_of_occupancy, deed_of_assignment, affidavit, purchase_receipt, governors_consent, court_order, other]
        file_name:
          type: string
          minLength: 1
        notes:
          type: string
      required:
        - document_type
        - file_name

    EvidenceUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [pending_review, verified, rejected]
        notes:
          type: string

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
